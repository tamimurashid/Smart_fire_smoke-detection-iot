[env:esp8285]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 9600
monitor_filters = default
lib_deps = 
    miguelbalboa/MFRC522@^1.4.11
    tzapu/WiFiManager@^0.16.0
    ESP8266WebServer
    ESP8266WiFi
    ArduinoJson
    WiFiManager
    ESP8266mDNS
    DNSServer
    EEPROM
    Servo
    SPI
    Wire
    prampec/IotWebConf@^3.2.1
	adafruit/DHT sensor library@^1.4.6
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
    blynkkk/Blynk@^1.3.2
    
